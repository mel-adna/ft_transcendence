services:

  # ----------- Nginx ---------------
  nginx:
    image: nginx:stable-alpine
    container_name: team_pulse_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - teampulse_net
    restart: always

  # ----------- Frontend ---------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: team_pulse_frontend
    ports:
      - "5173:5173"
    environment:
      # - VITE_API_URL=/api/v1
      - VITE_CORE_API_URL=/api/v1
    networks:
      - teampulse_net
    restart: always

  # ----------- Backend ---------------
  backend:
    build: ./backend
    container_name: teampulse-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=teampulsedb
      - DB_USERNAME=med
      - DB_PASSWORD=123
      - FRONTEND_URL=https://localhost
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=teampulse-avatars
    depends_on:
      - postgres
      - minio
    networks:
      - teampulse_net
    restart: always

  # ----------- Database ---------------
  postgres:
    image: postgres:15-alpine
    container_name: teampulse-postgres
    environment:
      POSTGRES_USER: med
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: teampulsedb
    ports:
      - "5433:5432"
    networks:
      - teampulse_net
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ----------- minio ---------------
  minio:
      image: minio/minio:latest
      container_name: teampulse-minio
      ports:
        - "9000:9000"
        - "9001:9001"
      environment:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
      command: server /data --console-address ":9001"
      networks:
        - teampulse_net
      restart: always
      volumes:
        - minio_data:/data

networks:
  teampulse_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

