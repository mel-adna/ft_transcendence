services:
  # ----------- Nginx ---------------
  nginx:
    image: nginx:stable-alpine
    container_name: teampulse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - grafana
    networks:
      - teampulse_net
    restart: always

  # ----------- Frontend ---------------
  frontend:
    image: teampulse-frontend:1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teampulse-frontend
    ports:
      - "5173:5173"
    environment:
      # - VITE_API_URL=/api/v1
      - VITE_API_URL=/api
      - VITE_CORE_API_URL=/api/v1
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    networks:
      - teampulse_net
    restart: always

  # ----------- Backend ---------------
  backend:
    image: teampulse-backend:1.0
    build: ./backend
    container_name: teampulse-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=teampulsedb
      - DB_USERNAME=med
      - DB_PASSWORD=123
      - FRONTEND_URL=https://localhost
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_URL=https://localhost/avatars
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=teampulse-avatars
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL=${REDIS_CHANNEL}
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - teampulse_net
    restart: always

  # ----------- Database ---------------
  postgres:
    image: postgres:15-alpine
    container_name: teampulse-postgres
    environment:
      POSTGRES_USER: med
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: teampulsedb
    ports:
      - "5433:5432"
    networks:
      - teampulse_net
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ----------- minio ---------------
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: teampulse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    command: server /data --console-address ":9001"
    networks:
      - teampulse_net
    restart: always
    volumes:
      - minio_data:/data

    # ----------- Redis (chat-service Socket.io adapter) ---------------
  redis:
    image: redis:7-alpine
    container_name: teampulse-redis
    networks:
      - teampulse_net
    restart: always
    volumes:
      - redis_data:/data

  #   # ----------- Chat Service (Real-Time Chat & Presence) ---------------
  chat-service:
    build: ./chat-service
    container_name: teampulse-chat
    environment:
      - PORT=5005
      - NODE_ENV=production
      - CLIENT_URL=https://localhost
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://med:123@postgres:5432/teampulsedb?schema=chat
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - teampulse_net
    restart: always

  # ----------- Prometheus ---------------
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: teampulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - teampulse_net
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------- Grafana ---------------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: teampulse-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/infrastructure.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - teampulse_net
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------- Postgres Exporter ---------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: teampulse-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
    depends_on:
      - postgres
    networks:
      - teampulse_net
    restart: always

  # ----------- Nginx Exporter ---------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: teampulse-nginx-exporter
    command:
      - '-nginx.scrape-uri=http://nginx:8081/stub_status'
    depends_on:
      - nginx
    networks:
      - teampulse_net
    restart: always

  # ----------- cAdvisor ---------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: teampulse-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - '-docker_only=true'
    networks:
      - teampulse_net
    restart: always



networks:
  teampulse_net:
    driver: bridge



volumes:
  postgres_data:
  minio_data:
  redis_data:
  prometheus_data:
  grafana_data:
