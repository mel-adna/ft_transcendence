services:

  backend:
    build: ./backend
    container_name: teampulse-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=teampulsedb
      - DB_USERNAME=med
      - DB_PASSWORD=123
      - SPRING_REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    networks:
      - teampulse_net
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: teampulse-postgres
    environment:
      POSTGRES_USER: med
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: teampulsedb
    ports:
      - "5433:5432"
    networks:
      - teampulse_net
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: teampulse-redis
    ports:
      - "6379:6379"
    networks:
      - teampulse_net
    restart: always
    volumes:
      - redis_data:/data


networks:
  teampulse_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:




