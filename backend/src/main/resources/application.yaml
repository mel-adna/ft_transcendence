server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: team-pulse-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:teampulsedb}
    username: ${DB_USERNAME:med}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  mail:
    host: smtp.gmail.com
    port: 587
    username: mohamedbentalebakilo@gmail.com
    password: pyno tbky wasf whvy
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:cliend id dyali}
            client-secret: ${GOOGLE_CLIENT_SECRET:client secrets dyali}
            scope:
              - email
              - profile

app:
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  level:
    root: INFO
    com.teampulse.backend: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN